[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "../node_modules"]
allow_paths = ["../node_modules"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "paris"
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/", "@gluwa/asc-contracts/=../node_modules/@gluwa/asc-contracts/"]

[fuzz]
runs = 256
